global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: app
    static_configs:
      - targets: ["app:8000"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: docker
    scrape_interval: 2s
    static_configs:
      - targets: ["docker-exporter:9417"]
