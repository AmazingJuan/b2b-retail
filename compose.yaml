services:
  postgres:
    image: postgres:16-alpine
    container_name: b2b-retail-postgres
    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - .:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
